<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: 6px; fill: #ffffff; }
    .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; letter-spacing: 2px; fill: #7dd3fc; }
    .lang { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 16px; fill: #ffffff; }
    .tag { font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 10.5px; fill: #38bdf8; }
    .card { fill: #0a1e3a; stroke: #38bdf8; stroke-width: 1.5; rx: 14; opacity: 0.9; }
    .icon-bg { fill: #142643; rx: 10; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes glow { 0%, 100% { filter: url(#softglow); opacity: 1; } 50% { filter: url(#glow); opacity: 0.9; } }
    .anim { animation: float 4s ease-in-out infinite; }
    .anim2 { animation: float 4s ease-in-out infinite 1s; }
    .anim3 { animation: float 4s ease-in-out infinite 2s; }
    .anim4 { animation: float 4s ease-in-out infinite 3s; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
  </style>
  <radialGradient id="bgGrad" cx="50%" cy="15%" r="90%">
    <stop offset="0%" stop-color="#0a1c33"/>
    <stop offset="100%" stop-color="#020409"/>
  </radialGradient>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1000" height="620" rx="20" fill="url(#bgGrad)"/>
<rect x="3" y="3" width="994" height="614" rx="18" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35" filter="url(#softglow)"/>
<text x="500" y="52" text-anchor="middle" class="title" filter="url(#softglow)">MOST LANGUAGES</text>
<rect x="430" y="64" width="140" height="2" fill="#38bdf8" opacity="0.6"/>
<text x="500" y="90" text-anchor="middle" class="sub">BAHASA PEMROGRAMAN YANG DIGUNAKAN</text>

<!-- Kiri 1: JavaScript -->
<g transform="translate(60, 130)">
  <rect class="card" width="390" height="100"/>
  <rect class="icon-bg anim" x="24" y="20" width="64" height="64"/>
  <image href="data:image/svg+xml;base64," x="34" y="30" width="44" height="44"/>
  <text x="114" y="62" class="lang">JavaScript</text>
  <text x="114" y="80" class="tag">FRONTEND &bull; INTERAKTIF</text>
</g>

