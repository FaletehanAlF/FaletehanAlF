<svg width="900" height="100" viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .waveA { animation: driftA 9s linear infinite; }
  .waveB { animation: driftB 15s linear infinite; }
  @keyframes driftA { to { transform: translateX(-900px); } }
  @keyframes driftB { from { transform: translateX(-900px); } to { transform: translateX(0); } }
</style>
<linearGradient id="footGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#0a1c33"/>
  <stop offset="0.55" stop-color="#123a6b"/>
  <stop offset="1" stop-color="#2563eb"/>
</linearGradient>
<filter id="footGlow" x="-40%" y="-140%" width="180%" height="380%">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<path id="wBack" d="M0,62 Q75,48 150,62 T300,62 T450,62 T600,62 T750,62 T900,62 L900,100 L0,100 Z"/>
<path id="wFront" d="M0,52 Q75,34 150,52 T300,52 T450,52 T600,52 T750,52 T900,52 L900,100 L0,100 Z"/>
<path id="wEdge" d="M0,52 Q75,34 150,52 T300,52 T450,52 T600,52 T750,52 T900,52"/>
</defs>
<g class="waveB" fill="#2563eb" opacity="0.28">
  <use href="#wBack"/>
  <use href="#wBack" x="900"/>
</g>
<g class="waveA" fill="url(#footGrad)" opacity="0.95">
  <use href="#wFront"/>
  <use href="#wFront" x="900"/>
</g>
<g class="waveA" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" filter="url(#footGlow)">
  <use href="#wEdge"/>
  <use href="#wEdge" x="900"/>
</g>
</svg>
