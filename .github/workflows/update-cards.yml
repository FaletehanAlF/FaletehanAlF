name: Update stat cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/update-cards.yml"
      - "views.svg"
      - "followers.svg"

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update views & followers counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          import urllib.request


          def fetch(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {"User-Agent": "stat-cards"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read().decode("utf-8", "replace")


          def fmt(n):
              return f"{n:,}"


          def bump(path, span_id, value):
              with open(path, encoding="utf-8") as f:
                  content = f.read()
              new_content, count = re.subn(
                  r'(<tspan id="%s">)[\d,]+(</tspan>)' % span_id,
                  r"\g<1>" + fmt(value) + r"\g<2>",
                  content,
              )
              if count == 0:
                  print(f"WARN: span #{span_id} not found in {path}")
                  return False
              if new_content != content:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Updated {path}: {fmt(value)}")
                  return True
              print(f"No change for {path}")
              return False


          token = os.environ.get("GH_TOKEN", "")
          headers = {"User-Agent": "stat-cards"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          # Followers (live from GitHub API)
          try:
              data = json.loads(fetch("https://api.github.com/users/FaletehanAlF", headers))
              bump("followers.svg", "followers-count", int(data["followers"]))
          except Exception as e:
              print(f"WARN: followers update failed: {e}")

          # Profile views (live from komarev counter badge)
          try:
              badge = fetch("https://komarev.com/ghpvc/?username=FaletehanAlF&style=flat")
              numbers = re.findall(r">(\d[\d,]*)<", badge)
              if numbers:
                  bump("views.svg", "views-count", int(numbers[-1].replace(",", "")))
              else:
                  print("WARN: no number found in komarev badge")
          except Exception as e:
              print(f"WARN: views update failed: {e}")
          EOF

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add views.svg followers.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stat cards"
            git push
          fi
