<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .title { font-family: 'Fira Code','JetBrains Mono',ui-monospace,monospace; font-size: 28px; font-weight: 700; letter-spacing: 9px; fill: #ffffff; }
  .corner { stroke: #38bdf8; stroke-width: 2; fill: none; opacity: .8; }
  .grid { stroke: #38bdf8; stroke-opacity: .06; stroke-width: 1; }
  .stat-label { font-family: 'Fira Code','JetBrains Mono',ui-monospace,monospace; font-size: 11px; letter-spacing: 2px; fill: #7dd3fc; }
  .pct { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #ffffff; }
  .foot { font-family: 'Fira Code',ui-monospace,monospace; font-size: 10px; letter-spacing: 2px; fill: #7dd3fc; }
  .glowbar { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes scan { 0% { transform: translateY(-30px); } 100% { transform: translateY(410px); } }
  /* entrance: garis muncul satu-satu smooth */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .rise { opacity: 0; animation: rise .7s cubic-bezier(.22,.61,.36,1) forwards; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .bar-fill { transform: scaleX(0); transform-box: fill-box; transform-origin: left center; animation: grow 1.2s cubic-bezier(.22,.61,.36,1) forwards; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes shimmer { 0% { transform: translateX(-80px); opacity: 0; } 20% { opacity: .8; } 100% { transform: translateX(760px); opacity: 0; } }
  .shine { animation: shimmer 2.8s ease-in-out infinite; }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: .8; } 100% { opacity: 0; transform: translateY(-60px); } }
  .particle { opacity: 0; animation: floatUp 4s ease-in-out infinite; }
  @keyframes tipPulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .tip { animation: tipPulse 2s ease-in-out infinite; }
</style>
<radialGradient id="anaBg" cx="50%" cy="15%" r="90%">
  <stop offset="0%" stop-color="#0a1c33"/>
  <stop offset="45%" stop-color="#070d1a"/>
  <stop offset="100%" stop-color="#020409"/>
</radialGradient>
<radialGradient id="anaVig" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
</radialGradient>
<linearGradient id="anaFrame" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#2563eb;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#2563eb"><animate attributeName="stop-color" values="#2563eb;#38bdf8;#2563eb" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="anaRule" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
  <stop offset="20%" stop-color="#2563eb" stop-opacity="0.9"/>
  <stop offset="50%" stop-color="#38bdf8"/>
  <stop offset="80%" stop-color="#2563eb" stop-opacity="0.9"/>
  <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
</linearGradient>
<linearGradient id="anaBarGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#2563eb"/>
  <stop offset="100%" stop-color="#38bdf8"/>
</linearGradient>
<linearGradient id="anaShine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<filter id="anaGlow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="anaScan" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<clipPath id="barClip1"><rect x="80" y="164" width="740" height="10" rx="5"/></clipPath>
<clipPath id="barClip2"><rect x="80" y="212" width="740" height="10" rx="5"/></clipPath>
<clipPath id="barClip3"><rect x="80" y="260" width="740" height="10" rx="5"/></clipPath>
<clipPath id="barClip4"><rect x="80" y="308" width="740" height="10" rx="5"/></clipPath>
</defs>
<rect x="0" y="0" width="900" height="380" rx="18" fill="url(#anaBg)"/>
<rect x="0" y="0" width="900" height="380" rx="18" fill="url(#anaVig)"/>
<line class="grid" x1="0" y1="90" x2="900" y2="90"/>
<line class="grid" x1="0" y1="215" x2="900" y2="215"/>
<line class="grid" x1="0" y1="330" x2="900" y2="330"/>
<rect x="3" y="3" width="894" height="374" rx="16" fill="none" stroke="url(#anaFrame)" stroke-width="2" opacity="0.55"/>
<path class="corner" d="M24 60 L24 24 L60 24"/>
<path class="corner" d="M876 60 L876 24 L840 24"/>
<path class="corner" d="M24 320 L24 356 L60 356"/>
<path class="corner" d="M876 320 L876 356 L840 356"/>
<rect x="0" y="0" width="900" height="30" fill="url(#anaScan)" style="animation: scan 5s linear infinite;"/>
<g filter="url(#anaGlow)" class="rise" style="animation-delay:.05s">
  <text x="450" y="62" text-anchor="middle" class="title" fill="#38bdf8">ANALYTICS</text>
</g>
<rect class="glowbar rise" x="390" y="74" width="120" height="2" fill="#38bdf8" filter="url(#anaGlow)" style="animation-delay:.15s"/>
<rect class="rise" x="80" y="102" width="740" height="1.6" fill="url(#anaRule)" style="animation-delay:.25s">
  <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
</rect>
<g fill="#38bdf8">
  <circle cx="150" cy="102.8" r="2.4">
    <animate attributeName="cx" values="150;750;150" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>
</g>
<!-- ROW 1 -->
<g class="rise" style="animation-delay:.35s">
  <text x="80" y="156" class="stat-label">FULL-STACK DEVELOPMENT</text>
  <text x="820" y="156" text-anchor="end" class="pct">92%</text>
</g>
<g class="rise" style="animation-delay:.45s">
  <rect x="80" y="164" width="740" height="10" rx="5" fill="#0a1e3a" stroke="#38bdf8" stroke-opacity="0.25"/>
  <rect class="bar-fill" x="80" y="164" width="681" height="10" rx="5" fill="url(#anaBarGrad)" filter="url(#anaGlow)" style="animation-delay:.6s"/>
  <g clip-path="url(#barClip1)"><rect class="shine" x="80" y="164" width="80" height="10" fill="url(#anaShine)" style="animation-delay:.6s"/></g>
  <circle class="tip" cx="761" cy="169" r="3" fill="#ffffff" filter="url(#anaGlow)"/>
</g>
<!-- ROW 2 -->
<g class="rise" style="animation-delay:.55s">
  <text x="80" y="204" class="stat-label">FRONTEND // REACT - NEXT.JS</text>
  <text x="820" y="204" text-anchor="end" class="pct">88%</text>
</g>
<g class="rise" style="animation-delay:.65s">
  <rect x="80" y="212" width="740" height="10" rx="5" fill="#0a1e3a" stroke="#38bdf8" stroke-opacity="0.25"/>
  <rect class="bar-fill" x="80" y="212" width="651" height="10" rx="5" fill="url(#anaBarGrad)" filter="url(#anaGlow)" style="animation-delay:.8s"/>
  <g clip-path="url(#barClip2)"><rect class="shine" x="80" y="212" width="80" height="10" fill="url(#anaShine)" style="animation-delay:1.1s"/></g>
  <circle class="tip" cx="731" cy="217" r="3" fill="#ffffff" filter="url(#anaGlow)" style="animation-delay:.4s"/>
</g>
<!-- ROW 3 -->
<g class="rise" style="animation-delay:.75s">
  <text x="80" y="252" class="stat-label">CONSISTENCY // COMMITS</text>
  <text x="820" y="252" text-anchor="end" class="pct">76%</text>
</g>
<g class="rise" style="animation-delay:.85s">
  <rect x="80" y="260" width="740" height="10" rx="5" fill="#0a1e3a" stroke="#38bdf8" stroke-opacity="0.25"/>
  <rect class="bar-fill" x="80" y="260" width="562" height="10" rx="5" fill="url(#anaBarGrad)" filter="url(#anaGlow)" style="animation-delay:1s"/>
  <g clip-path="url(#barClip3)"><rect class="shine" x="80" y="260" width="80" height="10" fill="url(#anaShine)" style="animation-delay:1.6s"/></g>
  <circle class="tip" cx="642" cy="265" r="3" fill="#ffffff" filter="url(#anaGlow)" style="animation-delay:.8s"/>
</g>
<!-- ROW 4 -->
<g class="rise" style="animation-delay:.95s">
  <text x="80" y="300" class="stat-label">UI-UX // AI EXPLORATION</text>
  <text x="820" y="300" text-anchor="end" class="pct">69%</text>
</g>
<g class="rise" style="animation-delay:1.05s">
  <rect x="80" y="308" width="740" height="10" rx="5" fill="#0a1e3a" stroke="#38bdf8" stroke-opacity="0.25"/>
  <rect class="bar-fill" x="80" y="308" width="511" height="10" rx="5" fill="url(#anaBarGrad)" filter="url(#anaGlow)" style="animation-delay:1.2s"/>
  <g clip-path="url(#barClip4)"><rect class="shine" x="80" y="308" width="80" height="10" fill="url(#anaShine)" style="animation-delay:2.1s"/></g>
  <circle class="tip" cx="591" cy="313" r="3" fill="#ffffff" filter="url(#anaGlow)" style="animation-delay:1.2s"/>
</g>
<!-- particles -->
<circle class="particle" cx="120" cy="340" r="2" fill="#38bdf8" style="animation-delay:0s"/>
<circle class="particle" cx="450" cy="345" r="2" fill="#7dd3fc" style="animation-delay:1.3s"/>
<circle class="particle" cx="780" cy="340" r="2" fill="#38bdf8" style="animation-delay:2.6s"/>
<!-- footer -->
<g class="rise" style="animation-delay:1.4s">
  <text x="450" y="352" text-anchor="middle" class="foot">LIVE SVG // REFRESH TO REPLAY<tspan class="cursor" fill="#ffffff">_</tspan></text>
</g>
</svg>
